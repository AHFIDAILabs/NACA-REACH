# =============================================================================
# NACA AI HIV Chatbot — Full Stack Docker Compose (App + Dependencies)
# Usage: docker compose -f docker-compose.yml -f docker-compose.app.yml up
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: naca-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NACA_DATABASE_URL=postgresql+asyncpg://naca:naca_dev@postgres:5432/naca_chatbot
      - NACA_REDIS_URL=redis://redis:6379/0
      - NACA_QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
